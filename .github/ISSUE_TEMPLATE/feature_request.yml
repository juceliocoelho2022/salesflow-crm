name: Feature request
description: Propor uma melhoria de produto
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema de negócio
      placeholder: 'Como vendedor, preciso de...'
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solução proposta
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceitação
      placeholder: '- [ ] Dado... quando... então...'
    validations:
      required: true
